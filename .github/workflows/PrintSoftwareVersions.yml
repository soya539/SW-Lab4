name: Print Software Versions

on:
  push:
    paths:
      - '.github/workflows/PrintSoftwareVersions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  PrintLanguageVersions:
    name: Print application stack versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print application tools versions
        run: |
          echo '--- Processing layer: JavaScript / Node.js ---'
          node --version
          npm --version
          git --version

  PrintDBMSVersions:
    name: Print MongoDB DBMS version
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Print MongoDB server version
        run: |
          echo '--- Data access layer: MongoDB ---'
          docker run --rm mongo:8.0 mongod --version
